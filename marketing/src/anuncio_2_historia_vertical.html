<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Anuncio 2 · Historia vertical 1080×1920</title>
<link rel="stylesheet" href="estilos.css">
<style>
  html, body { width: 1080px; height: 1920px; }
  .marca { left: 70px; top: 90px; font-size: 34px; }
  .pildora { left: 70px; top: 210px; }
  h1 { left: 70px; top: 290px; width: 940px; font-size: 118px; }
  .sub { left: 70px; top: 640px; width: 780px; font-size: 36px; }
  .phone { left: 300px; top: 850px; width: 600px; }
  .phone .pantalla { background: #fdfcf8; border-radius: 58px; overflow: hidden; padding-top: 46px; }
  .phone .pantalla img { border-radius: 0; }
  .phone::before { top: 34px; height: 26px; z-index: 3; }
  .aviso.a { left: 24px; top: 1130px; z-index: 4; }
  .aviso.b { right: -10px; top: 1460px; z-index: 4; }
  .cta { left: 70px; top: 1730px; font-size: 34px; padding: 26px 46px; z-index: 6; }
  .url { right: 70px; top: 1758px; font-size: 30px; z-index: 6; }
  .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 330px; background: linear-gradient(to top, #060a15 25%, transparent); z-index: 5; }
  .nota { z-index: 6; }
</style>
</head>
<body>
  <div class="glow" style="width:640px;height:640px;background:#3d63d6;left:200px;top:980px"></div>
  <div class="marca"><img src="../assets/logo.png" alt=""><span>ChloeRestaurant</span></div>
  <div class="pildora">Comandero móvil</div>
  <h1>Toma pedidos desde el <em>celular</em>.</h1>
  <div class="sub">La comanda llega a cocina y bar al instante. Sin papelitos, sin idas y vueltas.</div>
  <div class="phone"><div class="pantalla"><img src="../capturas/movil_pedido_dorado.png" alt="Comandero en el celular"></div></div>
  <div class="aviso a"><div class="ico">✓</div><div><strong>Comanda enviada</strong><span>Mesa 2 · Cocina y bar</span></div></div>
  <div class="aviso b"><div class="ico" style="background:#ecbc4a">◔</div><div><strong>Mesa 11</strong><span>3 platos en cocina</span></div></div>
  <div class="fade"></div>
  <div class="cta">Comienza ahora <span>→</span></div>
  <div class="url"><b>●</b> chloerestaurant.lat</div>
  <div class="nota" style="right:70px;top:110px">Imagen con datos de demostración.</div>
</body>
</html>
